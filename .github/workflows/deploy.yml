name: Deploy

# Every push to main publishes the game to Cloudflare Pages, which serves it at
# https://superboss.jackmertens.com. See DEPLOY.md for the one-time setup.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT: superboss
  SITE_URL: https://superboss.jackmertens.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          set -euo pipefail
          # Only the files the browser needs - no README, no workflows.
          site=dist/site
          mkdir -p "$site"
          cp index.html styles.css ./*.js "$site/"
          cp -R assets "$site/"

      - name: Add cache headers
        run: |
          set -euo pipefail
          # The filenames are not content-hashed, so the code must revalidate on
          # every load. Sprite frames are effectively immutable once published,
          # but keep their TTL short enough that a redraw ships the same day.
          # _headers is column-sensitive, so write it with printf rather than an
          # indented heredoc.
          printf '%s\n' \
            '/*' \
            '  Cache-Control: no-cache' \
            '  X-Content-Type-Options: nosniff' \
            '  Referrer-Policy: strict-origin-when-cross-origin' \
            '' \
            '/assets/*' \
            '  Cache-Control: public, max-age=3600, must-revalidate' \
            > dist/site/_headers

      - name: Check the site is complete
        run: |
          set -euo pipefail
          site=dist/site
          missing=0
          # Every asset index.html pulls in must have made it into the upload.
          refs=$(grep -oE '(src|href)="[^"]+"' "$site/index.html" | sed -E 's/.*"(.*)"/\1/')
          for ref in $refs; do
            case "$ref" in
              http*|//*|data:*|\#*) continue ;;
            esac
            if [ ! -f "$site/$ref" ]; then
              echo "::error::index.html references $ref, which is not in the upload"
              missing=1
            fi
          done
          for required in assets/sprites/packs.json; do
            if [ ! -e "$site/$required" ]; then
              echo "::error::missing $required"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main marks this a production deployment, which is what the
          # custom domain serves.
          command: >-
            pages deploy dist/site
            --project-name=${{ env.CLOUDFLARE_PROJECT }}
            --branch=main
            --commit-dirty=true

      - name: Summarise
        run: |
          {
            echo "### Deployed"
            echo
            echo "- Live: <${SITE_URL}>"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
